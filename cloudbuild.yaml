steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - .
      - -f
      - Dockerfile
      - --platform=linux/amd64

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE_NAME
      - --image=$_AR_HOSTNAME/$PROJECT_ID/cloud-run-source-deploy/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
      - --region=$_DEPLOY_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --set-env-vars=GROQ_API_KEY=$_GROQ_API_KEY,MAX_DAILY_COST=$_MAX_DAILY_COST,MAX_SESSION_COST=$_MAX_SESSION_COST
      - --memory=2Gi
      - --cpu=2
      - --concurrency=50
      - --min-instances=0
      - --max-instances=5
      - --timeout=60s

substitutions:
  _SERVICE_NAME: ecommerce-agent
  _DEPLOY_REGION: us-central1
  _AR_HOSTNAME: us-central1-docker.pkg.dev
  _GROQ_API_KEY: your-key-here
  _MAX_DAILY_COST: "10.0"
  _MAX_SESSION_COST: "2.0"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
