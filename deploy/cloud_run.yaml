# Cloud Run YAML — deploy via: gcloud run deploy ecommerce-agent --source .
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: aisle
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/ingress-status: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 50
      timeoutSeconds: 60
      containers:
        - image: aisle
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 2Gi
              cpu: 2
          env:
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: groq-api-key
                  key: latest
            - name: MAX_DAILY_COST
              value: "10.0"
            - name: MAX_SESSION_COST
              value: "2.0"
            - name: MAX_TOKENS_PER_SESSION
              value: "50000"
            - name: HARD_STOP_ENABLED
              value: "true"
            - name: LOG_LEVEL
              value: "INFO"
